<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Realm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22 fill=%22%2369b578%22%3E@%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="screen" tabindex="0" aria-label="ASCII Realm. Move with WASD or arrow keys. Use the equipment controls to choose a weapon and material."></canvas>
    <aside id="loadout" data-game-ui aria-label="Equipment">
      <div class="equipment-row">
        <label for="weapon-select">Weapon <span class="shortcut">1–9</span></label>
        <select id="weapon-select" aria-describedby="weapon-help"></select>
      </div>
      <div class="equipment-row">
        <label for="material-select">Material <span class="shortcut">M</span></label>
        <select id="material-select"></select>
      </div>
      <div class="stamina-row">
        <label for="stamina">Stamina</label>
        <meter id="stamina" min="0" max="100" value="100">100 / 100</meter>
        <output id="stamina-value" for="stamina">100</output>
      </div>
      <div class="weapon-state">
        <span id="weapon-status" role="status">Sheathed</span>
        <progress id="charge" max="1" value="0" aria-label="Attack charge" hidden></progress>
      </div>
      <p id="weapon-help">Tap J / left click to strike. Hold to charge.</p>
      <output id="recovered-items" class="recovery-counts" aria-label="Recovered projectiles">Recovered: 0 arrows · 0 spears · 0 javelins</output>
      <p id="collection-status" role="status" hidden></p>
      <p class="recovery-help">Walk near landed arrows, spears and javelins to collect.</p>
      <p class="loadout-shortcuts">[ ] cycle weapon &middot; M material &middot; F draw/sheathe</p>
    </aside>
    <div id="hint">WASD / arrows — walk &middot; Shift — run &middot; Space — jump &middot; scroll / + − — zoom</div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
