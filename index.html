<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>ASCII Realm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22 fill=%22%2369b578%22%3E@%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="touch-controls" aria-label="Game controls">
      <div id="move-pad" aria-label="Drag to walk. Push to the edge to run." role="group">
        <span id="move-stick"></span>
        <span class="move-label">MOVE / RUN</span>
      </div>
      <div class="actions">
        <button type="button" data-key="KeyF" aria-label="Draw or sheathe sword">DRAW</button>
        <button type="button" data-key="Space" aria-label="Jump">JUMP</button>
        <button type="button" data-key="KeyJ" class="strike" aria-label="Strike">STRIKE</button>
      </div>
      <div class="zoom-controls" aria-label="Zoom">
        <button type="button" data-zoom="0.8695652174" aria-label="Zoom out">−</button>
        <button type="button" data-zoom="1.15" aria-label="Zoom in">+</button>
      </div>
    </div>
    <p id="status" role="status" hidden></p>
    <div id="hint">WASD — walk &middot; Shift — run &middot; Space — jump &middot; J / click — strike &middot; F — draw or sheathe &middot; scroll — zoom</div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
