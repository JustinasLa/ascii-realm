<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Realm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22 fill=%22%2369b578%22%3E@%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="screen"></canvas>
    <details id="audio-controls">
      <summary>Audio</summary>
      <button id="audio-mute" type="button" aria-pressed="false">Mute (M)</button>
      <label>Master <input type="range" min="0" max="100" data-volume="master" aria-label="Master volume" /><output></output></label>
      <label>Music <input type="range" min="0" max="100" data-volume="music" aria-label="Music volume" /><output></output></label>
      <label>Effects <input type="range" min="0" max="100" data-volume="sfx" aria-label="Effects volume" /><output></output></label>
      <label>Sword <input type="range" min="0" max="100" data-volume="sword" aria-label="Sword volume" /><output></output></label>
      <label>Ambience <input type="range" min="0" max="100" data-volume="ambience" aria-label="Ambience volume" /><output></output></label>
      <label>Weather <input type="range" min="0" max="100" data-volume="weather" aria-label="Weather volume" /><output></output></label>
      <p id="audio-status" role="status">Press a key or click to enable sound</p>
      <p>Now playing: <span id="audio-song"></span></p>
      <div class="weather-controls">
        <label for="audio-season">Season</label>
        <select id="audio-season" aria-label="Sound season"></select>
        <p id="audio-climate"></p>
      </div>
      <button id="audio-skip" type="button">Skip song (N)</button>
      <button id="grass-preview" type="button">Preview grass footsteps</button>
      <div class="weather-controls">
        <label for="audio-weather">Weather sound</label>
        <select id="audio-weather" aria-label="Weather sound"><option value="clear">Clear</option></select>
        <label>Intensity <input id="weather-intensity" type="range" min="0" max="100" aria-label="Weather intensity" /><output></output></label>
        <p id="weather-description"></p>
      </div>
    </details>
    <div id="hint">WASD — walk &middot; Shift — run &middot; Space — jump &middot; J / click — strike (hold to spin) &middot; F — draw or sheathe &middot; M — mute &middot; scroll — zoom</div>
    <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
